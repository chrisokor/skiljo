skill_name: process_openai_credit_transfer_prohibition
version: 1
trigger: customer_attempts_credit_transfer_sale_or_gift
inputs:
  - name: attempted_transfer_detected
    type: boolean
  - name: days_since_purchase
    type: integer
decision_zones:
  deterministic:
    - condition:
        all:
          - field: days_since_purchase
            op: gt
            value: 365
      action: expire_credits_no_refund
      citation:
        span:
          start: 336
          end: 457
        quoted_text: "Service Credits expire one year from the date of purchase and are\nnon-refundable at all times, including upon expiration."
  llm_assisted:
    - condition:
        all:
          - field: attempted_transfer_detected
            op: eq
            value: true
      action: evaluate_revoke_credits_and_suspend_or_terminate_account
      citation:
        span:
          start: 52
          end: 334
        quoted_text: "Service Credits may not be sold, transferred, or gifted to any other account\nor individual. Any attempt to transfer, sell, or gift Service Credits may\nresult in revocation of the credits without refund, and OpenAI may, at its\ndiscretion, suspend or terminate the associated account."
      requires_human_approval: true
  human_only: []
