skill_name: process_twilio_late_fee_and_suspension
version: 1
trigger: invoice_past_due_review
inputs:
  - name: days_since_invoice_date
    type: integer
decision_zones:
  deterministic:
    - condition:
        all:
          - field: days_since_invoice_date
            op: gt
            value: 15
          - field: days_since_invoice_date
            op: lte
            value: 45
      action: assess_late_fee_lesser_of_1_5_percent_or_legal_max
      citation:
        span:
          start: 51
          end: 247
        quoted_text: "Payment is due within 15 days of the invoice date. Invoices unpaid after this\n15-day grace period accrue a late fee of the lesser of 1.5% per month or the\nmaximum rate permitted by applicable law."
    - condition:
        all:
          - field: days_since_invoice_date
            op: gt
            value: 45
      action: suspend_account_until_paid_in_full
      citation:
        span:
          start: 249
          end: 461
        quoted_text: "If an invoice remains unpaid for 45 days past the invoice date, Twilio may\nsuspend the account's ability to send messages or make calls until the\noutstanding balance, including accrued late fees, is paid in full."
  llm_assisted: []
  human_only: []
