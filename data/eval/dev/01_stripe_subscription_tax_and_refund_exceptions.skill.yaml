skill_name: process_stripe_subscription_tax_and_refund_exception
version: 1
trigger: customer_requests_refund
inputs:
  - name: required_by_law
    type: boolean
  - name: feature_discontinued_no_replacement
    type: boolean
decision_zones:
  deterministic:
    - condition:
        all:
          - field: required_by_law
            op: eq
            value: false
          - field: feature_discontinued_no_replacement
            op: eq
            value: false
      action: deny_refund_fees_nonrefundable
      citation:
        span:
          start: 51
          end: 275
        quoted_text: "All Subscription fees are exclusive of applicable taxes, which are added to\neach invoice based on your billing address. Subscription fees are\nnon-refundable and non-cancelable once paid, except as required by\napplicable law."
    - condition:
        any:
          - field: required_by_law
            op: eq
            value: true
          - field: feature_discontinued_no_replacement
            op: eq
            value: true
      action: issue_prorated_refund
      citation:
        span:
          start: 51
          end: 568
        quoted_text: "All Subscription fees are exclusive of applicable taxes, which are added to\neach invoice based on your billing address. Subscription fees are\nnon-refundable and non-cancelable once paid, except as required by\napplicable law.\n\nNotwithstanding the foregoing, if Stripe discontinues a Subscription Plan\nfeature you were actively using and paying for, and no reasonably comparable\nreplacement is offered, you are entitled to a prorated refund of fees paid\nfor that feature for the remainder of the current billing period."
  llm_assisted: []
  human_only: []
