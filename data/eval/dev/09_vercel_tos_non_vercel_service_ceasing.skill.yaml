skill_name: process_vercel_non_vercel_service_ceasing_refund
version: 1
trigger: customer_requests_refund
inputs:
  - name: service_type
    type: string
    description: "non_vercel_service or core_platform"
  - name: non_vercel_service_discontinued
    type: boolean
decision_zones:
  deterministic:
    - condition:
        all:
          - field: service_type
            op: eq
            value: non_vercel_service
          - field: non_vercel_service_discontinued
            op: eq
            value: true
      action: issue_prorated_refund_for_discontinued_service
      citation:
        span:
          start: 62
          end: 373
        quoted_text: "Some features available through Vercel are provided by third parties\n(\"Non-Vercel Services\"). If a Non-Vercel Service you have paid for through\nVercel ceases to be offered, Vercel will issue a prorated refund for the\nunused portion of fees attributable to that Non-Vercel Service for the\ncurrent billing period."
    - condition:
        all:
          - field: service_type
            op: eq
            value: core_platform
      action: deny_refund_all_fees_nonrefundable
      citation:
        span:
          start: 375
          end: 551
        quoted_text: "This refund right applies only to Non-Vercel Services; it does not extend to\ncore Vercel platform features, which remain governed by the standard\nall-fees-nonrefundable policy."
  llm_assisted: []
  human_only: []
