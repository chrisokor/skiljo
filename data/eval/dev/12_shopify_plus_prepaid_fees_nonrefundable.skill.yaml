skill_name: process_shopify_plus_prepaid_fee_termination
version: 1
trigger: contract_terminated
inputs:
  - name: terminated_for
    type: string
    description: "customer_material_breach, shopify_uncured_breach, or expiration"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: terminated_for
            op: eq
            value: customer_material_breach
      action: forfeit_remaining_prepaid_fees_no_refund
      citation:
        span:
          start: 231
          end: 540
        quoted_text: "If your contract is terminated by Shopify for your material breach, all\nremaining prepaid fees for the unexpired term are forfeited and no refund is\ndue. If your contract is terminated by you for Shopify's uncured material\nbreach, Shopify will refund a prorated portion of prepaid fees for the\nunexpired term."
    - condition:
        all:
          - field: terminated_for
            op: eq
            value: shopify_uncured_breach
      action: issue_prorated_refund_of_unexpired_term
      citation:
        span:
          start: 231
          end: 540
        quoted_text: "If your contract is terminated by Shopify for your material breach, all\nremaining prepaid fees for the unexpired term are forfeited and no refund is\ndue. If your contract is terminated by you for Shopify's uncured material\nbreach, Shopify will refund a prorated portion of prepaid fees for the\nunexpired term."
  llm_assisted: []
  human_only: []
