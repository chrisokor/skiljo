skill_name: process_github_copilot_case_by_case_refund
version: 1
trigger: customer_requests_copilot_refund
inputs:
  - name: days_since_purchase
    type: integer
  - name: subscription_unused
    type: boolean
decision_zones:
  deterministic:
    - condition:
        all:
          - field: days_since_purchase
            op: gt
            value: 30
      action: deny_refund_tos_no_exceptions
      citation:
        span:
          start: 42
          end: 231
        quoted_text: "GitHub's Terms of Service state that there are no refunds or credits for\npartial months of service, downgrade refunds, or refunds for unused months\nwith an open account, with no exceptions."
  llm_assisted: []
  human_only:
    - condition:
        all:
          - field: days_since_purchase
            op: lte
            value: 30
          - field: subscription_unused
            op: eq
            value: true
      action: evaluate_case_by_case_via_support_virtual_agent

      citation:
        span:
          start: 233
          end: 528
        quoted_text: "Separately, GitHub's published support flow for Copilot subscriptions\ndescribes a 30-day refund window for an unused Copilot subscription, handled\ncase-by-case through the support Virtual Agent. Support agents evaluate each\nrequest individually against usage data before approving or denying it."