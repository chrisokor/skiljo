skill_name: process_square_reserve_withholding_and_recovery
version: 1
trigger: merchant_risk_or_penalty_event
inputs:
  - name: event_type
    type: string
    description: "elevated_chargeback_risk_detected or network_fee_or_penalty_incurred"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: event_type
            op: eq
            value: network_fee_or_penalty_incurred
      action: debit_linked_bank_account_recovery_authorization
      citation:
        span:
          start: 312
          end: 605
        quoted_text: "Separately, if a merchant incurs fees, fines, or penalties imposed by a card\nnetwork or Square related to chargebacks or excessive refund activity, the\nmerchant authorizes Square to debit the merchant's linked bank account for\nthose amounts (a \"Recovery Authorization\") without further notice."
  llm_assisted:
    - condition:
        all:
          - field: event_type
            op: eq
            value: elevated_chargeback_risk_detected
      action: evaluate_and_withhold_settlement_reserve
      citation:
        span:
          start: 72
          end: 310
        quoted_text: "If Square determines, in its discretion, that a merchant account presents an\nelevated risk of chargebacks, refunds, or other liabilities, Square may\nwithhold a reserve from the merchant's settlement funds until the risk\nperiod has passed."
      requires_human_approval: true
  human_only: []
