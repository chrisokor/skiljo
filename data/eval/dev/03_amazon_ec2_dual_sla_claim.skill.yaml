skill_name: process_amazon_ec2_region_level_claim
version: 1
trigger: sla_credit_claim_submitted
inputs:
  - name: sla_type
    type: string
    description: "region_level"
  - name: has_required_subject_line
    type: boolean
  - name: has_required_claim_details
    type: boolean
  - name: billing_cycles_since_incident
    type: integer
decision_zones:
  deterministic:
    - condition:
        all:
          - field: has_required_subject_line
            op: eq
            value: true
          - field: has_required_claim_details
            op: eq
            value: true
          - field: billing_cycles_since_incident
            op: lte
            value: 2
      action: accept_region_level_claim_for_review
      citation:
        span:
          start: 386
          end: 690
        quoted_text: "To submit a region-level claim, you must include \"SLA Credit Request\" in the\nsubject line, the affected dates and times, and the affected resource IDs,\nand submit it by the end of the second billing cycle after the incident\noccurred. Claims that omit required information or miss the deadline are\ndenied."
    - condition:
        any:
          - field: has_required_subject_line
            op: eq
            value: false
          - field: has_required_claim_details
            op: eq
            value: false
          - field: billing_cycles_since_incident
            op: gt
            value: 2
      action: deny_claim_missing_requirements_or_deadline
      citation:
        span:
          start: 386
          end: 690
        quoted_text: "To submit a region-level claim, you must include \"SLA Credit Request\" in the\nsubject line, the affected dates and times, and the affected resource IDs,\nand submit it by the end of the second billing cycle after the incident\noccurred. Claims that omit required information or miss the deadline are\ndenied."
  llm_assisted: []
  human_only: []
