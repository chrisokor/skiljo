skill_name: process_vercel_tos_billing_event
version: 1
trigger: billing_or_usage_event
inputs:
  - name: event_type
    type: string
    description: "subscription_renewal, on_demand_usage, anomalous_use_detected, refund_request"
  - name: non_vercel_service_discontinued
    type: boolean
    description: "True if a non-core Vercel service the customer paid for has been discontinued by Vercel"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: event_type
            op: eq
            value: subscription_renewal
      action: charge_payment_method_in_advance
      citation:
        span:
          start: 91
          end: 603
        quoted_text: "Vercel will automatically charge your credit card or other payment method on record with Vercel (\"payment method\") in connection with the use of the Services:\n(i) in advance of each self-service subscription term, for the self-service subscription enabled and any additional Services added;\n(ii) in arrears, at any point during the self-service subscription term, for any Services used or added during the prior self-service subscription term;\n(iii) immediately for any Services that are not recurring in nature."
    - condition:
        all:
          - field: event_type
            op: eq
            value: on_demand_usage
      action: charge_payment_method_in_arrears
      citation:
        span:
          start: 91
          end: 603
        quoted_text: "Vercel will automatically charge your credit card or other payment method on record with Vercel (\"payment method\") in connection with the use of the Services:\n(i) in advance of each self-service subscription term, for the self-service subscription enabled and any additional Services added;\n(ii) in arrears, at any point during the self-service subscription term, for any Services used or added during the prior self-service subscription term;\n(iii) immediately for any Services that are not recurring in nature."
    - condition:
        all:
          - field: event_type
            op: eq
            value: refund_request
          - field: non_vercel_service_discontinued
            op: eq
            value: false
      action: deny_refund_all_fees_nonrefundable
      citation:
        span:
          start: 811
          end: 895
        quoted_text: "All fees are non-refundable, except as expressly stated otherwise in this Agreement."
    - condition:
        all:
          - field: non_vercel_service_discontinued
            op: eq
            value: true
      action: issue_prorated_refund_for_discontinued_service
      citation:
        span:
          start: 1405
          end: 1619
        quoted_text: "If Vercel ceases to offer a service that is not a core Vercel-branded service, Vercel may provide a pro-rated refund for any prepaid fees attributable to the discontinued service for the period following cessation."
  llm_assisted:
    - condition:
        all:
          - field: event_type
            op: eq
            value: anomalous_use_detected
      action: charge_accrued_fees_for_anomalous_use
      citation:
        span:
          start: 919
          end: 1161
        quoted_text: "If Vercel detects elevated, irregular, high or anomalous use of the Services, as determined in Vercel's sole discretion, Vercel may automatically charge your payment method for the then accrued fees in connection with the use of the Services."
      requires_human_approval: true
  human_only: []
