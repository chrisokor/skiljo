skill_name: process_twilio_billing_dispute_or_late_payment
version: 1
trigger: billing_dispute_or_late_payment_event
inputs:
  - name: event_type
    type: string
    description: "dispute or late_payment"
  - name: days_since_invoice
    type: integer
    description: "Days elapsed since the invoice date"
  - name: days_since_written_notice
    type: integer
    description: "Days elapsed since Twilio's written notice of non-payment (for late_payment events)"
  - name: monthly_fees_usd
    type: number
    description: "Total monthly fees billed"
  - name: dispute_submitted_in_writing
    type: boolean
decision_zones:
  deterministic:
    - condition:
        all:
          - field: event_type
            op: eq
            value: dispute
          - field: days_since_invoice
            op: lte
            value: 60
          - field: dispute_submitted_in_writing
            op: eq
            value: true
      action: accept_dispute_for_review
      citation:
        span:
          start: 712
          end: 1055
        quoted_text: "You will notify Twilio in writing within sixty (60) days of the date Twilio bills you for any Fees that you wish to dispute. Disputes submitted after sixty (60) days will not be eligible for review. During a pending dispute, you may withhold the disputed amount provided you act reasonably and cooperate diligently to resolve the disagreement."
    - condition:
        all:
          - field: event_type
            op: eq
            value: dispute
          - field: days_since_invoice
            op: gt
            value: 60
      action: reject_dispute_outside_window
      citation:
        span:
          start: 712
          end: 1055
        quoted_text: "You will notify Twilio in writing within sixty (60) days of the date Twilio bills you for any Fees that you wish to dispute. Disputes submitted after sixty (60) days will not be eligible for review. During a pending dispute, you may withhold the disputed amount provided you act reasonably and cooperate diligently to resolve the disagreement."
    - condition:
        all:
          - field: event_type
            op: eq
            value: late_payment
          - field: days_since_written_notice
            op: gt
            value: 15
      action: assess_late_fee_and_suspend
      citation:
        span:
          start: 1086
          end: 1465
        quoted_text: "If you fail to pay the Fees and remedy such failure within fifteen (15) days of the date Twilio provides you with written notice of the same, then Twilio may:\n(i) assess, and you will pay, a late fee of the lesser of 1.5% per month or the maximum amount allowable by law; and\n(ii) suspend the provision of the Services to all of your accounts until the Fees due are paid in full."
  llm_assisted: []
  human_only: []
