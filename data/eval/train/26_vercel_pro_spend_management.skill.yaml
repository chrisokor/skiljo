skill_name: process_vercel_pro_spend_management
version: 1
trigger: monthly_usage_credit_recalculated
inputs:
  - name: credit_consumed_percentage
    type: number
  - name: cumulative_overage_usd
    type: number
  - name: spend_cap_is_default
    type: boolean
    description: "True if the account owner has not raised or removed the default $200/month cap"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: credit_consumed_percentage
            op: gte
            value: 75
          - field: credit_consumed_percentage
            op: lt
            value: 100
      action: notify_owner_75_percent_credit_consumed
      citation:
        span:
          start: 234
          end: 399
        quoted_text: "Notifications: Vercel notifies the account owner by email once cumulative\nusage reaches 75% of the monthly usage credit, and again when the credit is\nfully consumed."
    - condition:
        all:
          - field: credit_consumed_percentage
            op: gte
            value: 100
      action: notify_owner_credit_fully_consumed_and_bill_overage
      citation:
        span:
          start: 234
          end: 399
        quoted_text: "Notifications: Vercel notifies the account owner by email once cumulative\nusage reaches 75% of the monthly usage credit, and again when the credit is\nfully consumed."
    - condition:
        all:
          - field: spend_cap_is_default
            op: eq
            value: true
          - field: cumulative_overage_usd
            op: gte
            value: 200
      action: pause_usage_until_next_billing_cycle
      citation:
        span:
          start: 29
          end: 232
        quoted_text: "Your Pro plan includes a $20 monthly usage credit applied automatically to\non-demand overage charges. Once the included credit is exhausted, additional\nusage is billed at standard per-unit overage rates."
  llm_assisted: []
  human_only: []
