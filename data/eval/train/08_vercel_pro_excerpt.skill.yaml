skill_name: process_vercel_pro_billing_overage
version: 1
trigger: monthly_billing_cycle_ends
inputs:
  - name: fast_data_transfer_tb
    type: number
    description: "Fast Data Transfer consumed in TB this month"
  - name: edge_requests_millions
    type: number
    description: "Edge Requests consumed in millions this month"
  - name: additional_seats
    type: integer
    description: "Number of additional deploying seats (Owner/Member) beyond the 1 included"
  - name: monthly_credit_consumed_usd
    type: number
    description: "Amount of the $20 monthly credit already consumed"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: fast_data_transfer_tb
            op: lte
            value: 1.0
          - field: edge_requests_millions
            op: lte
            value: 10.0
          - field: additional_seats
            op: eq
            value: 0
      action: charge_platform_fee_only
      citation:
        span:
          start: 1160
          end: 1357
        quoted_text: "The Pro platform fee is $20/month, which includes 1 deploying team seat and the $20/month usage credit. Additional deploying seats (Owner or Member roles) are $20/month each. Viewer seats are free."
    - condition:
        all:
          - field: monthly_credit_consumed_usd
            op: gte
            value: 15.0
      action: send_75_percent_credit_notification
      citation:
        span:
          start: 758
          end: 1003
        quoted_text: "You will receive automatic notifications when your usage has reached 75% of your monthly credit. Once you exceed the monthly credit, Vercel switches your team to on-demand usage and you will receive daily and weekly summary emails of your usage."
    - condition:
        any:
          - field: fast_data_transfer_tb
            op: gt
            value: 1.0
          - field: edge_requests_millions
            op: gt
            value: 10.0
      action: apply_monthly_credit_then_charge_on_demand
      citation:
        span:
          start: 85
          end: 537
        quoted_text: "Every Pro plan includes $20 in monthly credit. This credit applies to all managed infrastructure billable resources after their respective included allocations are exceeded.\n\nIncluded Infrastructure Usage\n\nEach month, you have the following included allocations:\n- 1 TB Fast Data Transfer\n- 10,000,000 Edge Requests\n\nOnce you exceed these included allocations, Vercel will charge usage against your monthly credit before switching to on-demand billing."
    - condition:
        all:
          - field: additional_seats
            op: gt
            value: 0
      action: charge_additional_seats_at_20_per_seat
      citation:
        span:
          start: 1160
          end: 1357
        quoted_text: "The Pro platform fee is $20/month, which includes 1 deploying team seat and the $20/month usage credit. Additional deploying seats (Owner or Member roles) are $20/month each. Viewer seats are free."
  llm_assisted: []
  human_only: []
