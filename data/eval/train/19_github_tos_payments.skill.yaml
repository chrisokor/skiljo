skill_name: process_github_payment_refund_request
version: 1
trigger: customer_requests_refund
inputs:
  - name: request_type
    type: string
    description: "partial_month, downgrade, unused_months, other"
decision_zones:
  deterministic:
    - condition:
        all: []
      action: deny_refund_no_exceptions
      citation:
        span:
          start: 484
          end: 715
        quoted_text: "The Service is non-refundable. There will be no refunds or credits for partial months of service, downgrade refunds, or refunds for months unused with an open Account. In order to treat everyone equally, no exceptions will be made."
  llm_assisted: []
  human_only: []
