skill_name: process_vercel_pro_monthly_bill
version: 1
trigger: monthly_billing_cycle_ends
inputs:
  - name: deploying_seats
    type: integer
    description: "Total number of Owner/Member seats (including the 1 included)"
  - name: fast_data_transfer_tb
    type: number
    description: "Fast Data Transfer consumed in TB this month"
  - name: edge_requests_millions
    type: number
    description: "Edge Requests consumed in millions this month"
  - name: monthly_credit_consumed_usd
    type: number
    description: "Dollar amount of the $20 monthly credit consumed so far"
  - name: on_demand_spend_usd
    type: number
    description: "Dollar amount of on-demand usage charges this billing cycle"
  - name: add_ons_enabled
    type: array
    description: "List of enabled add-on feature names"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: deploying_seats
            op: gt
            value: 1
      action: charge_additional_seats_at_20_per_seat
      citation:
        span:
          start: 393
          end: 506
        quoted_text: "- Additional deploying seats (Owner or Member roles): $20/month each\n- Viewer seats (read-only): Free (unlimited)"
    - condition:
        all:
          - field: fast_data_transfer_tb
            op: lte
            value: 1.0
          - field: edge_requests_millions
            op: lte
            value: 10.0
      action: no_overage_charge_within_included_allocation
      citation:
        span:
          start: 740
          end: 841
        quoted_text: "Included Infrastructure Allocations (per month):\n- 1 TB Fast Data Transfer\n- 10,000,000 Edge Requests"
    - condition:
        any:
          - field: fast_data_transfer_tb
            op: gt
            value: 1.0
          - field: edge_requests_millions
            op: gt
            value: 10.0
      action: deduct_overage_from_monthly_credit_then_charge_on_demand
      citation:
        span:
          start: 843
          end: 1116
        quoted_text: "Credit and Allocation Cascade Logic:\n1. Included allocations are consumed first (no charge).\n2. After included allocations are exhausted, usage is charged against the $20 monthly credit.\n3. After the monthly credit is exhausted, usage is billed on-demand at per-unit rates."
    - condition:
        all:
          - field: monthly_credit_consumed_usd
            op: gte
            value: 15.0
      action: send_75_percent_credit_usage_notification
      citation:
        span:
          start: 1340
          end: 1585
        quoted_text: "You will receive automatic notifications when your usage has reached 75% of your monthly credit. Once you exceed the monthly credit, Vercel switches your team to on-demand usage and you will receive daily and weekly summary emails of your usage."
    - condition:
        all:
          - field: on_demand_spend_usd
            op: gte
            value: 200.0
      action: trigger_spend_management_notification
      citation:
        span:
          start: 1605
          end: 1825
        quoted_text: "You can configure alerts and automatic actions when your account reaches a certain spend threshold. By default, Vercel enables spend management notifications for new customers at a spend amount of $200 per billing cycle."
    - condition:
        all:
          - field: add_ons_enabled
            op: not_empty
      action: charge_enabled_add_ons_at_published_rates
      citation:
        span:
          start: 1841
          end: 2247
        quoted_text: "The following features are available as add-ons:\n- SAML Single Sign-On: $300/month\n- HIPAA BAA: $350/month\n- Advanced Deployment Protection: $150/month\n- Flags Explorer: $250/month\n- Observability Plus: $1.20 per 1 million events\n- Preview Deployment Suffix: $100/month\n- Static IPs: $100/month per project, plus Private Data Transfer\n- Web Analytics Plus: $10/month\n- Speed Insights: $10/month per project"
  llm_assisted: []
  human_only: []
