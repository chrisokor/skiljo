skill_name: process_google_cloud_compute_sla_credit
version: 1
trigger: sla_credit_claim_submitted
inputs:
  - name: instance_configuration
    type: string
    description: "multiple_zones or single_instance"
  - name: monthly_uptime_percentage
    type: number
    description: "Observed monthly uptime percentage (0-100)"
  - name: days_since_incident
    type: integer
    description: "Days elapsed since the SLA incident"
  - name: claim_submitted_via_support_portal
    type: boolean
  - name: claim_includes_resource_ids_and_timestamps
    type: boolean
  - name: monthly_compute_charges_usd
    type: number
    description: "Total Compute Engine charges for the billing month"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: days_since_incident
            op: gt
            value: 30
      action: reject_claim_outside_30_day_window
      citation:
        span:
          start: 1082
          end: 1398
        quoted_text: "To receive a Service Credit, you must submit a request within 30 days of the incident. Claims submitted after 30 days will not be eligible for credit. Requests must be submitted through the Google Cloud Console support portal and must include the relevant resource IDs, timestamps, and a description of the incident."
    - condition:
        all:
          - field: claim_submitted_via_support_portal
            op: eq
            value: false
      action: reject_claim_wrong_submission_channel
      citation:
        span:
          start: 1082
          end: 1398
        quoted_text: "To receive a Service Credit, you must submit a request within 30 days of the incident. Claims submitted after 30 days will not be eligible for credit. Requests must be submitted through the Google Cloud Console support portal and must include the relevant resource IDs, timestamps, and a description of the incident."
    - condition:
        all:
          - field: claim_includes_resource_ids_and_timestamps
            op: eq
            value: false
      action: reject_claim_missing_details
      citation:
        span:
          start: 1082
          end: 1398
        quoted_text: "To receive a Service Credit, you must submit a request within 30 days of the incident. Claims submitted after 30 days will not be eligible for credit. Requests must be submitted through the Google Cloud Console support portal and must include the relevant resource IDs, timestamps, and a description of the incident."
    - condition:
        all:
          - field: claim_submitted_via_support_portal
            op: eq
            value: true
          - field: claim_includes_resource_ids_and_timestamps
            op: eq
            value: true
          - field: days_since_incident
            op: lte
            value: 30
          - field: instance_configuration
            op: eq
            value: multiple_zones
          - field: monthly_uptime_percentage
            op: lt
            value: 99.99
          - field: monthly_uptime_percentage
            op: gte
            value: 99.0
      action: issue_credit_10_percent_capped_at_50_percent_monthly_bill
      citation:
        span:
          start: 390
          end: 1398
        quoted_text: "Instances in Multiple Zones:\n- Less than 99.99% but greater than or equal to 99.0%: 10% credit of monthly charges\n- Less than 99.0% but greater than or equal to 95.0%: 25% credit of monthly charges\n- Less than 95.0%: 50% credit of monthly charges\n\nSingle Instance:\n- Less than 99.5% but greater than or equal to 99.0%: 10% credit of monthly charges\n- Less than 99.0% but greater than or equal to 95.0%: 25% credit of monthly charges\n- Less than 95.0%: 50% credit of monthly charges\n\nService Credit Cap\n\nIn no event will the total service credits issued in any single billing month exceed 50% of the amounts paid or payable by you for Compute Engine in that month.\n\nClaim Notification Window\n\nTo receive a Service Credit, you must submit a request within 30 days of the incident. Claims submitted after 30 days will not be eligible for credit. Requests must be submitted through the Google Cloud Console support portal and must include the relevant resource IDs, timestamps, and a description of the incident."
    - condition:
        all:
          - field: claim_submitted_via_support_portal
            op: eq
            value: true
          - field: claim_includes_resource_ids_and_timestamps
            op: eq
            value: true
          - field: days_since_incident
            op: lte
            value: 30
          - field: instance_configuration
            op: eq
