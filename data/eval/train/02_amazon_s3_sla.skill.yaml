        span:
          start: 853
          end: 1166
        quoted_text: "Claim Requirements:\nTo receive a Service Credit, you must submit a request to AWS Support within two billing cycles of the incident. Your claim must include \"SLA Credit Request\" in the subject line, the affected AWS region, dates and times of the unavailability incidents, and request logs documenting the errors."