skill_name: process_github_marketplace_billing_change
version: 1
trigger: customer_changes_marketplace_plan
inputs:
  - name: change_direction
    type: string
    description: "upgrade, downgrade, or cancel"
decision_zones:
  deterministic:
    - condition:
        any:
          - field: change_direction
            op: eq
            value: downgrade
          - field: change_direction
            op: eq
            value: cancel
      action: keep_current_plan_active_until_cycle_end_no_refund
      citation:
        span:
          start: 28
          end: 409
        quoted_text: "If you downgrade or cancel a Marketplace app's paid plan, no refund or credit\nis issued for the unused portion of the current billing cycle. Your current\nplan, and any features or usage limits associated with it, remains active\nuntil the end of the billing cycle in which you downgraded or canceled; the\nnew (lower or free) plan takes effect at the start of the next billing cycle."
    - condition:
        all:
          - field: change_direction
            op: eq
            value: upgrade
      action: apply_plan_immediately_and_charge_prorated_difference
      citation:
        span:
          start: 28
          end: 409
        quoted_text: "If you downgrade or cancel a Marketplace app's paid plan, no refund or credit\nis issued for the unused portion of the current billing cycle. Your current\nplan, and any features or usage limits associated with it, remains active\nuntil the end of the billing cycle in which you downgraded or canceled; the\nnew (lower or free) plan takes effect at the start of the next billing cycle."
  llm_assisted: []
  human_only: []
