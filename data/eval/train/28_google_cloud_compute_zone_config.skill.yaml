skill_name: process_google_cloud_compute_zone_config_credit
version: 1
trigger: sla_credit_claim_submitted
inputs:
  - name: instance_configuration
    type: string
    description: "multi_zone or single_zone"
  - name: monthly_uptime_percentage
    type: number
decision_zones:
  deterministic:
    - condition:
        all:
          - field: instance_configuration
            op: eq
            value: multi_zone
          - field: monthly_uptime_percentage
            op: lt
            value: 99.99
          - field: monthly_uptime_percentage
            op: gte
            value: 99.0
      action: apply_10_percent_credit
      citation:
        span:
          start: 149
          end: 446
        quoted_text: "Instances in Multiple Zones: If your Covered Instances are configured to run\nin multiple zones in more than one region, and the monthly uptime percentage\nfalls below 99.99% but at or above 99.0%, you receive a 10% credit. Below\n99.0% but at or above 95.0%, a 25% credit. Below 95.0%, a 50% credit."
    - condition:
        all:
          - field: instance_configuration
            op: eq
            value: single_zone
          - field: monthly_uptime_percentage
            op: lt
            value: 99.5
          - field: monthly_uptime_percentage
            op: gte
            value: 99.0
      action: apply_10_percent_credit
      citation:
        span:
          start: 448
          end: 751
        quoted_text: "Single Zone or Single Instance: If your Covered Instances are configured to\nrun as a single instance or within a single zone, the monthly uptime\npercentage must fall below 99.5% but at or above 99.0% for a 10% credit,\nbelow 99.0% but at or above 95.0% for a 25% credit, and below 95.0% for a 50%\ncredit."
    - condition:
        all:
          - field: instance_configuration
            op: in
            value: ["multi_zone", "single_zone"]
          - field: monthly_uptime_percentage
            op: lt
            value: 99.0
          - field: monthly_uptime_percentage
            op: gte
            value: 95.0
      action: apply_25_percent_credit
      citation:
        span:
          start: 149
          end: 751
        quoted_text: "Instances in Multiple Zones: If your Covered Instances are configured to run\nin multiple zones in more than one region, and the monthly uptime percentage\nfalls below 99.99% but at or above 99.0%, you receive a 10% credit. Below\n99.0% but at or above 95.0%, a 25% credit. Below 95.0%, a 50% credit.\n\nSingle Zone or Single Instance: If your Covered Instances are configured to\nrun as a single instance or within a single zone, the monthly uptime\npercentage must fall below 99.5% but at or above 99.0% for a 10% credit,\nbelow 99.0% but at or above 95.0% for a 25% credit, and below 95.0% for a 50%\ncredit."
    - condition:
        all:
          - field: instance_configuration
            op: in
            value: ["multi_zone", "single_zone"]
          - field: monthly_uptime_percentage
            op: lt
            value: 95.0
      action: apply_50_percent_credit_capped_at_50_percent_of_monthly_bill
      citation:
        span:
          start: 149
          end: 883
        quoted_text: "Instances in Multiple Zones: If your Covered Instances are configured to run\nin multiple zones in more than one region, and the monthly uptime percentage\nfalls below 99.99% but at or above 99.0%, you receive a 10% credit. Below\n99.0% but at or above 95.0%, a 25% credit. Below 95.0%, a 50% credit.\n\nSingle Zone or Single Instance: If your Covered Instances are configured to\nrun as a single instance or within a single zone, the monthly uptime\npercentage must fall below 99.5% but at or above 99.0% for a 10% credit,\nbelow 99.0% but at or above 95.0% for a 25% credit, and below 95.0% for a 50%\ncredit.\n\nIn no event will total credits for any billing month exceed 50% of the\namount payable for that month, regardless of configuration."
  llm_assisted: []
  human_only: []
