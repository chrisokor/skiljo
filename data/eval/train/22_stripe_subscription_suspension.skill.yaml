skill_name: process_stripe_subscription_suspension
version: 1
trigger: payment_failure_or_suspension_review
inputs:
  - name: days_since_payment_due
    type: integer
  - name: days_suspended
    type: integer
  - name: is_first_failure_in_12_months
    type: boolean
  - name: account_brought_current
    type: boolean
decision_zones:
  deterministic:
    - condition:
        all:
          - field: days_since_payment_due
            op: gt
            value: 15
          - field: account_brought_current
            op: eq
            value: false
      action: suspend_access
      citation:
        span:
          start: 52
          end: 314
        quoted_text: "If a payment for your Subscription Plan fails, we will retry the charge\naccording to our standard retry schedule. If payment continues to fail for\nmore than 15 days after the original due date, we may suspend your access to\nthe Service until payment is received."
    - condition:
        all:
          - field: days_suspended
            op: gte
            value: 30
          - field: account_brought_current
            op: eq
            value: false
      action: terminate_subscription_no_refund
      citation:
        span:
          start: 316
          end: 559
        quoted_text: "If your Subscription remains suspended for 30 consecutive days or more due to\nnon-payment, we may terminate your Subscription. Upon termination for\nnon-payment, any outstanding fees remain due and no refund is issued for the\nterminated period."
    - condition:
        all:
          - field: account_brought_current
            op: eq
            value: true
          - field: days_suspended
            op: lt
            value: 30
      action: restore_access_immediately
      citation:
        span:
          start: 561
          end: 860
        quoted_text: "Reinstatement: If you bring your account current within the 30-day suspension\nwindow, access is restored immediately upon successful payment. No late fee\nis assessed for the first payment failure in a rolling 12-month period; a 1.5%\nmonthly late fee applies to any subsequent failure in that window."
    - condition:
        all:
          - field: is_first_failure_in_12_months
            op: eq
            value: false
          - field: account_brought_current
            op: eq
            value: true
      action: assess_late_fee_1_5_percent_per_month
      citation:
        span:
          start: 561
          end: 860
        quoted_text: "Reinstatement: If you bring your account current within the 30-day suspension\nwindow, access is restored immediately upon successful payment. No late fee\nis assessed for the first payment failure in a rolling 12-month period; a 1.5%\nmonthly late fee applies to any subsequent failure in that window."
  llm_assisted: []
  human_only: []
