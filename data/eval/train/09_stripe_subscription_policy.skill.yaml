skill_name: process_stripe_subscription_refund
version: 1
trigger: customer_requests_refund_or_cancellation
inputs:
  - name: usage_within_entitlement
    type: boolean
    description: "True if usage has not exceeded the plan entitlement limit"
  - name: subscription_term_active
    type: boolean
    description: "True if the current subscription term is still ongoing"
  - name: payment_failed
    type: boolean
    description: "True if a payment has failed or been disputed"
  - name: plan_change_type
    type: string
    description: "none, upgrade, or downgrade"
  - name: legal_refund_required
    type: boolean
    description: "True if applicable law mandates a refund"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: legal_refund_required
            op: eq
            value: true
      action: approve_statutory_refund
    - condition:
        all:
          - field: subscription_term_active
            op: eq
            value: true
          - field: legal_refund_required
            op: eq
            value: false
      action: deny_refund_no_prorated_refunds
    - condition:
        all:
          - field: payment_failed
            op: eq
            value: true
      action: suspend_subscription_access
    - condition:
        all:
          - field: plan_change_type
            op: in
            value: ["upgrade", "downgrade"]
      action: apply_plan_change_at_next_billing_period
  llm_assisted: []
  human_only: []
