skill_name: process_openai_service_credit_refund
version: 1
trigger: customer_requests_credit_refund_or_transfer
inputs:
  - name: request_type
    type: string
    description: "refund, transfer, or sale"
  - name: credits_used
    type: boolean
    description: "True if any portion of the credits have been used"
  - name: days_since_purchase
    type: integer
    description: "Days since the credits were purchased"
  - name: legal_refund_required
    type: boolean
    description: "True if applicable law requires a refund regardless of policy"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: legal_refund_required
            op: eq
            value: true
      action: approve_statutory_refund
      citation:
        span:
          start: 197
          end: 376
        quoted_text: "All OpenAI API service credits are non-refundable except where required by applicable law. Once purchased, credits cannot be exchanged for cash or any other form of consideration."
    - condition:
        all:
          - field: request_type
            op: in
            value: ["transfer", "sale"]
      action: deny_transfer_or_sale_prohibited
      citation:
        span:
          start: 759
          end: 1017
        quoted_text: "If OpenAI determines that credits were used in violation of these terms \u2014 including any attempted unauthorized transfer, sale, or gifting \u2014 OpenAI may, in its sole discretion, revoke the applicable credits and terminate the associated account without refund."
    - condition:
        all:
          - field: days_since_purchase
            op: gt
            value: 365
      action: deny_credits_expired
      citation:
        span:
          start: 390
          end: 536
        quoted_text: "Service credits expire one year from the date of purchase. Unused credits are forfeited at expiration and will not be refunded or carried forward."
    - condition:
        all:
          - field: credits_used
            op: eq
            value: true
          - field: request_type
            op: eq
            value: refund
          - field: legal_refund_required
            op: eq
            value: false
      action: deny_refund_credits_already_used
      citation:
        span:
          start: 759
          end: 1017
        quoted_text: "If OpenAI determines that credits were used in violation of these terms \u2014 including any attempted unauthorized transfer, sale, or gifting \u2014 OpenAI may, in its sole discretion, revoke the applicable credits and terminate the associated account without refund."
  llm_assisted: []
  human_only:
    - condition:
        all:
          - field: request_type
            op: eq
            value: refund
          - field: credits_used
            op: eq
            value: false
          - field: days_since_purchase
            op: lte
            value: 365
          - field: legal_refund_required
            op: eq
            value: false
      action: escalate_non_statutory_refund_for_review

      citation:
        span:
          start: 197
          end: 376
        quoted_text: "All OpenAI API service credits are non-refundable except where required by applicable law. Once purchased, credits cannot be exchanged for cash or any other form of consideration."