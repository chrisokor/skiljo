skill_name: process_notion_refund_with_regional_override
version: 1
trigger: customer_requests_refund
inputs:
  - name: billing_cadence
    type: string
    description: "monthly or annual"
  - name: days_since_payment
    type: integer
  - name: customer_region
    type: string
    description: "ISO region code; EU and UK have a mandatory 14-day statutory window"
  - name: is_accidental_member_addition
    type: boolean
  - name: credits_unused
    type: boolean
    description: "True if the purchased Notion credits have not been used at all"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: customer_region
            op: in
            value: ["EU", "UK"]
          - field: days_since_payment
            op: lte
            value: 14
      action: approve_statutory_14_day_refund
      citation:
        span:
          start: 436
          end: 775
        quoted_text: "If you are located in the European Union or United Kingdom, you are entitled to a refund within 14 days of your most recent payment, regardless of your billing cadence (monthly or annual). This right is provided under applicable EU and UK consumer protection law and supersedes the standard windows above where they offer a shorter period."
    - condition:
        all:
          - field: customer_region
            op: not_in
            value: ["EU", "UK"]
          - field: billing_cadence
            op: eq
            value: monthly
          - field: days_since_payment
            op: lte
            value: 3
      action: approve_refund
      citation:
        span:
          start: 76
          end: 408
        quoted_text: "If you signed up for a paid Notion subscription by mistake, you can contact us in the app or email to request a refund within the applicable window:\n- Monthly billing plan: refund request must be submitted within 3 days of the invoice date.\n- Annual billing plan: refund request must be submitted within 30 days of the invoice date."
    - condition:
        all:
          - field: customer_region
            op: not_in
            value: ["EU", "UK"]
          - field: billing_cadence
            op: eq
            value: annual
          - field: days_since_payment
            op: lte
            value: 30
      action: approve_refund
      citation:
        span:
          start: 76
          end: 408
        quoted_text: "If you signed up for a paid Notion subscription by mistake, you can contact us in the app or email to request a refund within the applicable window:\n- Monthly billing plan: refund request must be submitted within 3 days of the invoice date.\n- Annual billing plan: refund request must be submitted within 30 days of the invoice date."
    - condition:
        all:
          - field: is_accidental_member_addition
            op: eq
            value: true
          - field: days_since_payment
            op: lte
            value: 3
      action: approve_prorated_seat_refund
      citation:
        span:
          start: 804
          end: 968
        quoted_text: "If you were invoiced for members who were accidentally added to your workspace, we can refund the prorated charges if you reach out within three days of the charge."
    - condition:
        all:
          - field: credits_unused
            op: eq
            value: true
      action: approve_credits_refund
      citation:
        span:
          start: 986
          end: 1204
        quoted_text: "You can request a refund for any additional Notion credits you have purchased as long as they have not been used. Once any portion of purchased credits have been used, those credits are no longer eligible for a refund."
  llm_assisted: []
  human_only: []
