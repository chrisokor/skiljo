skill_name: process_steam_refund_excerpt
version: 1
trigger: customer_requests_refund
inputs:
  - name: product_type
    type: string
    description: "game_or_software or dlc"
  - name: days_since_purchase
    type: integer
  - name: playtime_hours
    type: number
    description: "Total playtime in hours for the base game since DLC purchase (for DLC) or overall (for games)"
  - name: dlc_consumed_or_modified_or_transferred
    type: boolean
    description: "True if the DLC has been consumed, modified, or transferred (DLC only)"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: product_type
            op: eq
            value: game_or_software
          - field: days_since_purchase
            op: lte
            value: 14
          - field: playtime_hours
            op: lt
            value: 2.0
      action: approve_refund
    - condition:
        all:
          - field: product_type
            op: eq
            value: dlc
          - field: days_since_purchase
            op: lte
            value: 14
          - field: playtime_hours
            op: lt
            value: 2.0
          - field: dlc_consumed_or_modified_or_transferred
            op: eq
            value: false
      action: approve_refund
    - condition:
        any:
          - all:
              - field: product_type
                op: eq
                value: game_or_software
              - field: days_since_purchase
                op: gt
                value: 14
          - all:
              - field: product_type
                op: eq
                value: game_or_software
              - field: playtime_hours
                op: gte
                value: 2.0
          - all:
              - field: product_type
                op: eq
                value: dlc
              - field: dlc_consumed_or_modified_or_transferred
                op: eq
                value: true
      action: deny_refund
  llm_assisted: []
  human_only: []
