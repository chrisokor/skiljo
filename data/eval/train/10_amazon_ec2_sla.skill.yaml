skill_name: process_amazon_ec2_sla_credit
version: 1
trigger: sla_credit_claim_submitted
inputs:
  - name: sla_type
    type: string
    description: "region_level or instance_level"
  - name: monthly_uptime_percentage
    type: number
    description: "Observed monthly uptime percentage (0-100)"
  - name: single_instance_unavailable_minutes_in_clockhour
    type: integer
    description: "Consecutive minutes a single instance was unavailable in a clock-hour (for automatic credit)"
  - name: claim_subject_includes_compute_sla_credit_request
    type: boolean
  - name: claim_includes_incident_details
    type: boolean
    description: "True if claim includes dates, region, AZ, and resource IDs"
  - name: billing_cycles_since_incident
    type: integer
    description: "Number of billing cycles elapsed since the incident"
decision_zones:
  deterministic:
    - condition:
        all:
          - field: single_instance_unavailable_minutes_in_clockhour
            op: gt
            value: 6
      action: issue_automatic_instance_credit_no_claim_required
      citation:
        span:
          start: 867
          end: 1072
        quoted_text: "AWS will not charge you for any Single EC2 Instance that is Unavailable for more than six consecutive minutes within a clock-hour. This credit is applied automatically without requiring a claim submission."
    - condition:
        all:
          - field: claim_subject_includes_compute_sla_credit_request
            op: eq
            value: true
          - field: claim_includes_incident_details
            op: eq
            value: true
          - field: billing_cycles_since_incident
            op: lte
            value: 2
          - field: monthly_uptime_percentage
            op: lt
            value: 99.99
          - field: monthly_uptime_percentage
            op: gte
            value: 99.0
      action: issue_credit_10_percent
      citation:
        span:
          start: 236
          end: 1590
        quoted_text: "Region-Level Credit Tiers:\n- Less than 99.99% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nInstance-Level SLA\n\nIndividual EC2 instances receive an Instance-Level Uptime Percentage of at least 99.5%.\n\nInstance-Level Credit Tiers:\n- Less than 99.5% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nAutomatic Instance Credit\n\nAWS will not charge you for any Single EC2 Instance that is Unavailable for more than six consecutive minutes within a clock-hour. This credit is applied automatically without requiring a claim submission.\n\nClaim Requirements\n\nTo receive a Service Credit for SLA violations (other than the automatic instance credit), you must submit a claim by opening a case in the AWS Support Center. Your claim must:\n- Include \"Amazon Compute SLA Credit Request\" in the subject line\n- Specify the dates and times of the unavailability incident\n- Identify the affected AWS region and Availability Zone\n- List the affected EC2 resource IDs\n\nClaims must be received by the end of the second billing cycle after which the incident occurred."
    - condition:
        all:
          - field: claim_subject_includes_compute_sla_credit_request
            op: eq
            value: true
          - field: claim_includes_incident_details
            op: eq
            value: true
          - field: billing_cycles_since_incident
            op: lte
            value: 2
          - field: monthly_uptime_percentage
            op: lt
            value: 99.0
          - field: monthly_uptime_percentage
            op: gte
            value: 95.0
      action: issue_credit_30_percent
      citation:
        span:
          start: 236
          end: 1590
        quoted_text: "Region-Level Credit Tiers:\n- Less than 99.99% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nInstance-Level SLA\n\nIndividual EC2 instances receive an Instance-Level Uptime Percentage of at least 99.5%.\n\nInstance-Level Credit Tiers:\n- Less than 99.5% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nAutomatic Instance Credit\n\nAWS will not charge you for any Single EC2 Instance that is Unavailable for more than six consecutive minutes within a clock-hour. This credit is applied automatically without requiring a claim submission.\n\nClaim Requirements\n\nTo receive a Service Credit for SLA violations (other than the automatic instance credit), you must submit a claim by opening a case in the AWS Support Center. Your claim must:\n- Include \"Amazon Compute SLA Credit Request\" in the subject line\n- Specify the dates and times of the unavailability incident\n- Identify the affected AWS region and Availability Zone\n- List the affected EC2 resource IDs\n\nClaims must be received by the end of the second billing cycle after which the incident occurred."
    - condition:
        all:
          - field: claim_subject_includes_compute_sla_credit_request
            op: eq
            value: true
          - field: claim_includes_incident_details
            op: eq
            value: true
          - field: billing_cycles_since_incident
            op: lte
            value: 2
          - field: monthly_uptime_percentage
            op: lt
            value: 95.0
      action: issue_credit_100_percent
      citation:
        span:
          start: 236
          end: 1590
        quoted_text: "Region-Level Credit Tiers:\n- Less than 99.99% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nInstance-Level SLA\n\nIndividual EC2 instances receive an Instance-Level Uptime Percentage of at least 99.5%.\n\nInstance-Level Credit Tiers:\n- Less than 99.5% but equal to or greater than 99.0%: 10% credit of monthly charges\n- Less than 99.0% but equal to or greater than 95.0%: 30% credit of monthly charges\n- Less than 95.0%: 100% credit of monthly charges\n\nAutomatic Instance Credit\n\nAWS will not charge you for any Single EC2 Instance that is Unavailable for more than six consecutive minutes within a clock-hour. This credit is applied automatically without requiring a claim submission.\n\nClaim Requirements\n\nTo receive a Service Credit for SLA violations (other than the automatic instance credit), you must submit a claim by opening a case in the AWS Support Center. Your claim must:\n- Include \"Amazon Compute SLA Credit Request\" in the subject line\n- Specify the dates and times of the unavailability incident\n- Identify the affected AWS region and Availability Zone\n- List the affected EC2 resource IDs\n\nClaims must be received by the end of the second billing cycle after which the incident occurred."
  llm_assisted: []
  human_only:
    - condition:
        any:
          - field: claim_subject_includes_compute_sla_credit_request
            op: eq
            value: false
          - field: claim_includes_incident_details
            op: eq
            value: false
          - field: billing_cycles_since_incident
            op: gt
            value: 2
      action: reject_claim_missing_requirements

      citation:
        span:
          start: 1094
          end: 1491
        quoted_text: "To receive a Service Credit for SLA violations (other than the automatic instance credit), you must submit a claim by opening a case in the AWS Support Center. Your claim must:\n- Include \"Amazon Compute SLA Credit Request\" in the subject line\n- Specify the dates and times of the unavailability incident\n- Identify the affected AWS region and Availability Zone\n- List the affected EC2 resource IDs"