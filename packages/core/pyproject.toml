[project]
name = "skiljo-core"
version = "0.1.0"
description = "Core extraction, simulation, and storage logic for Skiljo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "inspect-ai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skiljo_core"]
