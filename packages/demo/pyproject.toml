[project]
name = "skiljo-demo"
version = "0.1.0"
description = "Streamlit demo UI for Skiljo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.38",
    "skiljo-core",
]

[tool.uv.sources]
skiljo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skiljo_demo"]
