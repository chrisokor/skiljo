[project]
name = "skiljo-api"
version = "0.1.0"
description = "FastAPI backend for Skiljo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "skiljo-core",
]

[tool.uv.sources]
skiljo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skiljo_api"]
