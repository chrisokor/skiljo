name: Eval Gate

# Runs the eval harness on every PR and blocks merge on regression, per
# DESIGN_DOCUMENT.md Section 9. Only against data/eval/train (and, once a dataset
# loader/solver land, dev/) -- data/eval/test/ is held out and never touched here.
#
# Current scope: all three suites (extraction plan #48, simulation plan #49, e2e
# plan #50) run against Inspect's mockllm/model provider. None of them has a
# dataset loader or solver wired to real pipeline/engine runs against
# data/eval/train/ yet (see docs/evals.md, "Dataset" section), so every metric here
# is vacuous (1.0) today -- this gate exercises the CI plumbing (collect metrics ->
# diff against the committed baseline -> block on regression) honestly, without
# fabricating quality numbers. Once the loader/solver land, pass a real --model to
# skiljo_core.eval.collect_metrics and the numbers become real with no other change
# needed here.
#
# The `update-baseline` job (plan #58) runs after every merge to main and commits a
# freshly recomputed data/eval/baseline_metrics.json back, so the file every PR's
# `eval` job diffs against tracks main instead of going stale. It reuses the exact
# same collect_all_metrics() call the `eval` job uses to produce "current" metrics
# (skiljo_core.eval.baseline.update_baseline), so baseline and comparison are always
# apples-to-apples.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need origin/main history to read the baseline metrics file

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run eval suite tests
        run: |
          uv run pytest \
            packages/core/tests/test_eval_extraction.py \
            packages/core/tests/test_eval_simulation.py \
            packages/core/tests/test_eval_e2e.py \
            packages/core/tests/test_eval_data.py \
            packages/core/tests/test_eval_collect_metrics.py \
            packages/core/tests/test_eval_regression.py \
            -v

      - name: Collect eval metrics
        run: uv run python -m skiljo_core.eval.collect_metrics --output eval-results.json

      - name: Check for regressions against main
        env:
          BASELINE_REFRESH_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'approved-eval-baseline-refresh') }}
        run: |
          if git diff --quiet origin/main -- data/eval/baseline_metrics.json; then
            baseline_args=(
              --baseline-ref origin/main
              --baseline-path data/eval/baseline_metrics.json
            )
          elif [[ "$BASELINE_REFRESH_APPROVED" == "true" ]]; then
            echo "Using the explicitly approved working-tree eval baseline changed by this PR."
            baseline_args=(--baseline-file data/eval/baseline_metrics.json)
          else
            echo "Baseline changes require the approved-eval-baseline-refresh PR label."
            exit 1
          fi
          uv run python scripts/check_regression.py \
            --current eval-results.json \
            "${baseline_args[@]}" \
            --check extraction_recall=-0.02 \
            --check citation_resolution=0:min=1.0 \
            --check contradiction_recall=-0.05 \
            --check simulation_match_rate=-0.03 \
            --check e2e_accuracy=-0.03

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json

  update-baseline:
    name: Refresh eval baseline on main merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Refresh baseline metrics
        run: uv run python scripts/update_baseline.py

      - name: Commit refreshed baseline if changed
        run: |
          if git diff --quiet -- data/eval/baseline_metrics.json; then
            echo "Baseline metrics unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eval/baseline_metrics.json
          git commit -m "chore(eval): refresh baseline metrics [skip ci]"
          git push
